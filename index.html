 <!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Utility Trailer 3D — WebGL (No Libraries)</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<div id="app">
		<header>
			<strong>Utility Trailer 3D</strong>
			<span class="pill">LMB: orbit</span>
            <span class="pill">Wheel/Pinch: zoom</span>
            <span class="pill">R: reset</span>
			<button id="btnReset" class="btn" title="Reset view">Reset</button>
            <!-- Buttons for debug -->
            <button id="btnAxleDbg" class="btn" title="Toggle axles" hidden>Single Axle</button>
            <button class="btn" id="btnRoofLinesDbg" title="Toggle Roof Lines" hidden>Toggle Roof Lines</button>
            <button id="btnInterior" class="btn" title="Toggle interior view">Interior View</button>
			<button id="btnReview" class="btn" title="Review">Review</button>
            <!-- <button id="btnStructure" class="btn" title="Toggle structure view">Structure View</button -->
		</header>
		<main class="main-pane" style="display:flex; flex-direction:column; align-items:center; padding:1rem 0; overflow:auto;">
			<!-- 3D Viewer -->
			<div id="viewer-panel" class="viewer-panel" style="position:relative; width:100%; max-width:1200px; aspect-ratio:16/9; overflow:hidden; border-radius:.5rem;">
				<canvas id="gl" aria-label="3D canvas" role="img"></canvas>
				<div class="hud" id="hud">FPS: –</div>
			</div>
    		<!-- Size panel -->
			<section id="config-panel" class="config-panel" style="width:100%; max-width:1200px; margin-top:1rem; background:#f8f8fb; border-radius:.75rem .75rem 0 0; border:1px solid #d0d4e0; border-bottom:none; box-shadow:0 8px 20px rgba(0,0,0,.18); height:270px; min-height:270px; max-height:270px; display:flex; flex-direction:column;">
				<div class="config-panel-body" data-tab-body="width" data-display="flex" style="position:relative;">
		      			<div class="option-row"> 
    			    			<div class="option-col">
        	  					<label for="width-options" style="color: black; font-size: 2.5rem;">Pick Width</label>
          						<select id="width-options" name="width" style="color: white; background: black;font-size: 2.5rem;">
								<option value="60">5' (60")</option>
								<option value="72">6' (72")</option>
	            						<option value="84">7' (84")</option>
        	    						<option value="102">8'6" (102")</option>
	          					</select>
						</div>
      					</div>
				</div>
				<div class="config-panel-body" data-tab-body="length" data-display="flex" style="position:relative; display: none;">
    	  				<div class="option-row"> 
        					<div class="option-col">
          						<label for = "length-options" style="color: black; font-size: 2.5rem;">Pick Length</label>
	          					<select id="length-options" name="length" style="color: white; background: black; font-size: 2.5rem;">
								<option value="8">8'</option>
        	    						<option value="10">10'</option>
            							<option value="12">12'</option>
	            						<option value="14">14'</option>
	    	        					<option value="16">16'</option>
    	    	    						<option value="18">18'</option>
	        	    					<option value="20">20'</option>
		            					<option value="22">22'</option>
        		    					<option value="24">24'</option>
          						</select>
						</div>
					</div>
    				</div>
				<div class="config-panel-body" data-tab-body="size_axle" data-display="flex" style="position:relative; display:none;"> 
      					<div id="axle-form" class="axle-form">
        					<div class="axle">
          						<button class="option-card axle-option is-selected" data-axle="single">Single Axle<img src="single.JPG" alt="Single Axle" style="width:100%; display:block;"></button>
          						<button class="option-card axle-option" data-axle="tandem">Tandem Axle<img src="tandem.JPG" alt="Tandem Axle" style="width:100%; display:block;"></button>
							<div class="axle_size">
								<label for="axle_size" style="color: black;">Axle Size</label>						
								<select id="axle_size" name="axle_size" style="font-size: 2rem; color: white; background-color: black;">
									<option value="3_5_k">3.5K Axle</option>
									<option value="5_k">5K Axle</option>
									<option value="7_k">7K (2-3.5K) Axles</option>
									<option value="10_k">10K (2-5k) Axles</option>
									<option value="14_k">14K (2-7k) Axles</option>
								</select>
                                                        </div>
	          					<div id="axle-warning" class="axle-warning" hidden>
        		    					⚠️ 8' or 60" wide trailers are available in single axle only.
          						</div>
                                                        <div id="axle-warning-tandem" class="axle-warning" hidden>
                                                                ⚠️ 16' and up or 102" wide trailers are available in tandem axle only.
							</div>
        					</div>
					</div>
    				</div>
    				<!-- Color panel -->
    				<div class="config-panel-body" data-tab-body="color" style="position:relative; display:none">
      					<button class="scroll-arrow left" data-scroll="left">&#10094;</button>
	      				<div class="color-scroll">
        					<div class="color-strip" id="color-strip">
          						<button class="option-card color-option is-selected" data-color="silver">Silver<img src="silver.JPG" alt="Silver" style="width:100%; display:block;"></button>
          						<button class="option-card color-option" data-color="black">Black<img src="black.JPG" alt="black" style="width:100%; display:block;"></button>
          						<button class="option-card color-option" data-color="charcoal">Charcoal<img src="charcoal.JPG" alt="Charcoal" style="width:100%; display:block;"></button>
          						<button class="option-card color-option" data-color="white">White<img src="white.JPG" alt="White" style="width:100%; display:block;"></button>
          						<button class="option-card color-option" data-color="green">Green<img src="green.JPG" alt="Green" style="width:100%; display:block;"></button>
	          					<button class="option-card color-option" data-color="blue">Blue<img src="blue.JPG" alt="Blue" style="width:100%; display:block;"></button>
        	  					<button class="option-card color-option" data-color="red">Red<img src="red.JPG" alt="Red" style="width:100%; display:block;"></button>
          						<button class="option-card color-option" data-color="orange">Orange<img src="orange.JPG" alt="Orange" style="width:100%; display:block;"></button>
        					</div>
      					</div>
      					<!-- Right Arrow -->
      					<button class="scroll-arrow right" data-scroll="right">&#10095;</button>
	    			</div>
    			<!-- Feature panels -->
			<div class="config-panel-body" data-tab-body="feature_oc" style="display:none; color: black;">
      				<h1>Structure Features</h1>
      				<div class="feature_oc" style="display: flex; flex-direction: column; flex-wrap: wrap; max-height: 115px; align-content: flex-start; overflow: visible; column-gap: 16px;">
					<div>
						<label style="font-size: 2rem;">Floor OC</label><br>
						<select id="oc_floor" name="floor_oc" style="font-size: 2rem; color: white; background-color: black;">
    							<option value="24_foc">Standard</option>
							<option value="16_foc">16" OC</option>
							<option value="12_foc">12" OC</option>
						</select>
					</div>
					<div>
						<label style="font-size: 2rem;">Wall OC</label><br>
						<select id="oc_wall" name="wall_oc" style="font-size: 2rem;color: white; background-color: black;">
      							<option value="24_woc">Standard</option>
							<option value="16_woc">16" OC</option>
							<option value="12_woc">12" OC</option>
						</select>
					</div>
					<div>
						<label style="font-size: 2rem;">Roof OC</label><br>
						<select id="oc_roof" name="roof_oc" style="font-size: 2rem;color: white; background-color: black;">
							<option value="24_roc">Standard</option>
							<option value="16_roc">16" OC</option>
							<option value="12_roc">12" OC</option>
						</select>
					</div>
      				</div>
    			</div>
			<div class="config-panel-body" data-tab-body="feature_ad" style="display:none; color: black;">
      				<h1>Structure Features</h1>
      				<div class="feature_ad">
					<div>
						<label style="font-size: 2rem;">Additional Height</label><br>
						<select id="add_height" name="add_height" style="font-size: 2rem; color: white; background-color: black;">
    							<option value="none">Standard</option>
							<option value="6">6"</option>
							<option value="12">12"</option>
							<option value="18">18"</option>
							<option value="24">24"</option>
							<option value="30">30"</option>
							<option value="36">36"</option>
							<option value="42">42"</option>
						</select>
					</div>
				</div>
			</div>
    			<div class="config-panel-body" data-tab-body="feature_e" style="color: black;">
      				<h1>Exterior Features</h1>
      				<div class="feature_e" style="display: flex; gap: 12px; flex-direction: column; flex-wrap: wrap; max-height: 100px; overflow: auto;">
      					<label><input type="checkbox" name="feature_one_piece" id="btnRoofLines" title="Toggle Roof Lines">One Piece Aluminum Roof</label>
      					<label><input type="checkbox" name="feature_spare_outside"> Spare Tire Mount(Outside)</label>
      					<label><input type="checkbox" name="feature_blackout" id="btnBlackout">Blackout Package</label>
					<label><input type="checkbox" name="feature_marker">Additional Marker Lights</label>
      					<label><input type="checkbox" name="feature_tail">Additional Tail Lights(Requires 55" Barlock)</label>
      					<label><input type="checkbox" name="feature_flare" id="btnRearFlare">Rear Flare</label>
					<label><input type="checkbox" name="feature_side">24" Wide Side Door</label>
      					<label><input type="checkbox" name="feature_escape">Escape Door</label>
      					<label><input type="checkbox" name="feature_ladder">Ladder Rack</label>
					<label>Extended Tongue</label>
					<select id="ext_tongue" name="ext_tongue">
						<option value="none">Standard</option>
						<option value="6in">6"</option>
						<option value="12in">12"</option>
						<option value="18in">18"</option>
					</select>
      				</div>
    			</div>
				<div class="config-panel-body" data-tab-body="feature_i" style="display:none; color: black;">
      				<h1>Interior Features</h1>
      				<div class="feature_i">
      					<label><input type="checkbox" name="feature_spare_outside"> Spare Tire Mount(Outside)</label>
      					<label><input type="checkbox" name="feature_spare_inside"> Spare Tire Mount(Inside)</label>
      					<label><input type="checkbox" name="feature_1">Place holder 1</label>
      				</div>
				</div>
				<div class="config-panel-body" data-tab-body="review" style="display:none; color: black;">
					<h1 style="text-align: center">Review Your Build</h1>
					<div id="review-summary" style="font-size: 1.4rem; white-space: pre-line;"></div>
				</div>
				<div class="config-panel-body" data-tab-body="submit" style="display:none; color:black;">
					<div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 8px; max-width: 500px;">
						<label style="font-size: 1.4rem;">Your name <input type="text" id="cust-name" style="font-size: 1.4rem;"></label>
						<label style="font-size: 1.4rem;">Phone <input type="tel" id="cust-phone" style="font-size: 1.4rem;"></label>
						<label style="font-size: 1.4rem;">Email <input type="email" id="cust-email" style="font-size: 1.4rem;"></label>
					</div>
					<div id="send-note" style="margin-top: 0.5rem; font-size: 1.2rem;"></div>					
					<div style="margin-top: 1rem; display: flex; gap: 12px;">
						<button id="btnSend" class="btn" style="font-size: 1.6rem;">Send My Build</button>
						<button id="btnRestartReview" class="btn" style="font-size: 1.6rem;">Restart</button>
					</div>

				</div>
    			<div id="panel-footer" class="panel-footer">
      				<button id="back" class="btn">Back</button>
      				<button id="restart" class="btn">Restart</button>
      				<button id="next" class="btn">Next</button>
    			</div>
			</section>
		</main>
	</div>	
	<script src="scripts.js"></script>
</body>
</html>
